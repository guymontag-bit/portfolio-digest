name: Portfolio Digest & Catalyst Scraper

on:
  schedule:
    # Daily digest — weekdays at 5am ET (10:00 UTC)
    - cron: '0 10 * * 1-5'
    # Weekly catalyst scraper — Tuesdays at 5am ET (10:00 UTC)
    - cron: '0 10 * * 2'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:

  # ── Daily digest (existing) ─────────────────────────────────────────────────
  daily_digest:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 10 * * 1-5')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python digest.py

  # ── Weekly catalyst scraper (new) ──────────────────────────────────────────
  weekly_catalyst_scraper:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 10 * * 2')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly catalyst scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python weekly_catalyst_scraper.py
